<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4f0"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Hydra Password Generator</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17231d;background:#e8eee8;color-scheme:light}*{box-sizing:border-box}body{min-height:100vh;min-height:100svh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 12% 18%,#b9e0ae99,transparent 32%),linear-gradient(145deg,#eef2e9,#e1ebe4 55%,#f5eadb)}main{width:min(100%,460px);padding:38px;border:1px solid #fff;border-radius:26px;background:#ffffffef;box-shadow:0 24px 70px #1f38292b}h1{margin:0;font-size:clamp(2rem,7vw,2.6rem);letter-spacing:-.06em}.intro{margin:10px 0 24px;color:#73746d;line-height:1.5}.badge{display:inline-block;margin-bottom:12px;padding:7px 11px;border:1px solid #e4ecdf;border-radius:999px;background:#f3f7ef;color:#45694d;font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.output{display:flex;align-items:center;gap:12px;min-height:76px;padding:14px;border:1px solid #dfe9dc;border-radius:15px;background:#f1f6ef}.output output{min-width:0;flex:1;overflow-wrap:anywhere;color:#234b35;font:650 1.1rem Consolas,monospace}button{border:0;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}.copy{padding:10px 14px;background:white;color:#36573d}.strength,.length{display:flex;justify-content:space-between;margin:18px 0 7px;color:#72766d;font-size:.88rem}.track{height:8px;overflow:hidden;border-radius:9px;background:#e9eee7}.fill{height:100%;width:0;border-radius:9px;background:#54735a;transition:width .2s}.length{margin:24px 0 8px;color:#17231d;font-weight:650}input[type=range]{width:100%;accent-color:#568e5b}fieldset{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0;padding:0;border:0}legend{margin-bottom:8px;font-weight:650}.option{display:flex;align-items:center;gap:8px;padding:8px 4px;color:#4b5148;font-size:.9rem}.option input{accent-color:#568e5b}.generate{width:100%;min-height:52px;border-radius:12px;background:linear-gradient(110deg,#3f8a52,#276b43);color:#fff;font-size:1rem}.status{min-height:1.3em;margin:12px 0 0;color:#687560;font-size:.84rem;text-align:center}button:focus-visible,input:focus-visible{outline:3px solid #a9bea9;outline-offset:3px}@media(max-width:420px){main{padding:28px 22px}}</style></head><body><main><span class="badge">A little more peace of mind</span><h1>Hydra Password Generator</h1><p class="intro">Make a strong, random password in a click.</p><div class="output"><output id="password" aria-live="polite"></output><button class="copy" id="copy">Copy</button></div><div class="strength"><span>Estimated strength</span><strong id="strength">—</strong></div><div class="track"><div class="fill" id="fill"></div></div><label class="length" for="length"><span>Password length</span><span id="length-value">16</span></label><input id="length" type="range" min="8" max="40" value="16"><fieldset><legend>Include characters</legend><label class="option"><input type="checkbox" id="lowercase" checked>Lowercase</label><label class="option"><input type="checkbox" id="uppercase" checked>Uppercase</label><label class="option"><input type="checkbox" id="numbers" checked>Numbers</label><label class="option"><input type="checkbox" id="symbols">Symbols</label></fieldset><button class="generate" id="generate">Generate password</button><p class="status" id="status" role="status" aria-live="polite"></p></main><script>const groups=[['lowercase','abcdefghijklmnopqrstuvwxyz'],['uppercase','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],['numbers','0123456789'],['symbols','!@#$%^&*()-_=+[]{};:,.?']];const out=document.querySelector('#password'),length=document.querySelector('#length'),status=document.querySelector('#status');function randomIndex(max){const limit=4294967296-4294967296%max,data=new Uint32Array(1);do{crypto.getRandomValues(data)}while(data[0]>=limit);return data[0]%max}function generate(){const selected=groups.filter(([id])=>document.getElementById(id).checked);if(!selected.length){out.textContent='';status.textContent='Choose at least one character type.';return}const chars=selected.map(([,set])=>set).join(''),count=Number(length.value),password=selected.map(([,set])=>set[randomIndex(set.length)]);while(password.length<count)password.push(chars[randomIndex(chars.length)]);for(let i=password.length-1;i>0;i--){const j=randomIndex(i+1);[password[i],password[j]]=[password[j],password[i]]}out.textContent=password.join('');const entropy=count*Math.log2(chars.length),level=entropy<40?1:entropy<60?2:entropy<80?3:4;document.querySelector('#strength').textContent=['Weak','Fair','Good','Strong'][level-1];document.querySelector('#fill').style.width=level*25+'%';status.textContent=''}length.addEventListener('input',()=>{document.querySelector('#length-value').textContent=length.value;generate()});document.querySelectorAll('input[type=checkbox]').forEach(input=>input.addEventListener('change',generate));document.querySelector('#generate').addEventListener('click',generate);document.querySelector('#copy').addEventListener('click',async()=>{if(!out.textContent){status.textContent='Generate a password before copying.';return}try{await navigator.clipboard.writeText(out.textContent);status.textContent='Password copied.'}catch{status.textContent='Could not copy. Select and copy the password instead.'}});generate();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(error=>console.error('Offline support could not be registered.',error));</script></body></html>
